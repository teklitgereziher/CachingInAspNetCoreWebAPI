version: "3.8"
services:
  db:
    image: postgres:latest
    container_name: postgresdb_container
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: techuser
      POSTGRES_PASSWORD: strpass@tech

  redis:
    image: redis:latest
    container_name: redis_container
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - cachedb:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  cachedb:
    driver: local
